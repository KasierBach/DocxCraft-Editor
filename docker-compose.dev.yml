# Local development dependencies only. The app itself runs via `npm run dev`.
# Start with: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docxcraft
      POSTGRES_PASSWORD: docxcraft
      POSTGRES_DB: docxcraft
    ports:
      # 5433 avoids clashing with a Postgres already bound to 5432 on the host.
      - "5433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docxcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated throwaway database for the integration test suite
  # (server/__tests__/*.test.ts truncate their tables on every run).
  # Start with: npm run db:test:up
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docxcraft
      POSTGRES_PASSWORD: docxcraft
      POSTGRES_DB: docxcraft_test
    ports:
      # 5434 avoids clashing with the dev Postgres above.
      - "5434:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docxcraft -d docxcraft_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Apply every checked-in Prisma migration to the development database.
  # Run with: npm run db:migrate:docker
  postgres-migrate:
    profiles: ["migrate"]
    build:
      context: .
      target: build
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://docxcraft:docxcraft@postgres:5432/docxcraft
    depends_on:
      postgres:
        condition: service_healthy

  # The same migration command against the throwaway integration-test database.
  # Run with: npm run db:test:migrate:docker
  postgres-test-migrate:
    profiles: ["migrate"]
    build:
      context: .
      target: build
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://docxcraft:docxcraft@postgres-test:5432/docxcraft_test
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres-dev-data:
  postgres-test-data:
