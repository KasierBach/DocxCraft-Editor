<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocxCraft status</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4ef; color: #24211c; }
      main { width: min(34rem, calc(100% - 2rem)); padding: 2rem; background: #fffdf8; border: 1px solid #d9d3c7; border-radius: 1rem; }
      h1 { margin-top: 0; }
      [data-state="ok"] { color: #176b3a; }
      [data-state="error"] { color: #a52a2a; }
      @media (prefers-color-scheme: dark) { body { background: #1e1d1a; color: #f4f0e8; } main { background: #292722; border-color: #4b473f; } }
    </style>
  </head>
  <body>
    <main>
      <h1>DocxCraft status</h1>
      <p id="health" aria-live="polite">Checking API health…</p>
      <p id="ready" aria-live="polite">Checking storage readiness…</p>
      <p><a href="/">Return to editor</a></p>
    </main>
    <script>
      async function check(path, elementId, label) {
        const element = document.getElementById(elementId);
        try {
          const response = await fetch(path, { cache: 'no-store' });
          const body = await response.json();
          element.dataset.state = response.ok ? 'ok' : 'error';
          element.textContent = `${label}: ${body.status ?? response.status}`;
        } catch {
          element.dataset.state = 'error';
          element.textContent = `${label}: unavailable`;
        }
      }
      void check('/api/health', 'health', 'API');
      void check('/api/ready', 'ready', 'Storage');
    </script>
  </body>
</html>
