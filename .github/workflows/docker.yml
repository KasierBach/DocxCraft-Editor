name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test the image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Built for the local daemon instead of the registry, so a broken image
      # fails here rather than during a deploy.
      - name: Build image for smoke testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: docxcraft-smoke:ci
          cache-from: type=gha

      - name: Run the container and probe it
        run: |
          set -euo pipefail
          docker run -d --name docxcraft-smoke -p 4180:4175 -e AUTH_MODE=claim docxcraft-smoke:ci

          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/api/health > /dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          echo "--- container logs ---"
          docker logs docxcraft-smoke
          test "$healthy" = "1"

          # The built bundle must be inside the image, not just the API.
          curl -fsS http://127.0.0.1:4180/ | grep -qi "<title>"
          # Claim mode is the documented deployment default.
          curl -fsS http://127.0.0.1:4180/api/auth/session | grep -q '"needsSetup":true'
          # A missing bundle must 404 instead of serving index.html.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4180/assets/does-not-exist.js)" = "404"

          docker rm -f docxcraft-smoke
