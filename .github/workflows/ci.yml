name: CI

on:
  push:
    branches: ["**"]
    # Docs-only commits do not affect the build.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly run on main to catch dependency drift and flaky tests.
    - cron: "30 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The Postgres document-store contract tests run against this instance.
      TEST_DATABASE_URL: postgres://docxcraft:docxcraft@127.0.0.1:5432/docxcraft
      DATABASE_URL: postgres://docxcraft:docxcraft@127.0.0.1:5432/docxcraft
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: docxcraft
          POSTGRES_PASSWORD: docxcraft
          POSTGRES_DB: docxcraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docxcraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply database migrations
        run: npm run db:migrate
      - run: npm run test:coverage
      - run: npm run test:e2e
      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docx-editor-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
