# Hosted deployment: Postgres + migrations + app + Caddy (TLS).
#
#   1. cp deploy/.env.example deploy/.env   and fill it in
#   2. docker compose -f deploy/docker-compose.yml up -d
#
# The `migrate` service applies the Prisma schema before the app starts, so it
# builds the repository's build stage (which has the Prisma CLI). Run compose
# from a checkout of the repo on the host.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docxcraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: docxcraft
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docxcraft"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No published ports: reachable only on the compose network.

  migrate:
    build:
      context: ..
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgres://docxcraft:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/docxcraft
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/kasierbach/docxcraft-editor:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Hosted storage: metadata in Postgres, .docx blobs on the data volume.
      DOCUMENT_STORE: postgres
      DATABASE_URL: postgres://docxcraft:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/docxcraft
      BLOB_DIR: /app/data/blobs
      # Public origin; must match the OAuth redirect URIs exactly.
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL, e.g. https://docx-<vm-ip-with-dashes>.sslip.io}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?register a Google OAuth app and set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?register a GitHub OAuth app and set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      MAX_DOCUMENTS_PER_USER: ${MAX_DOCUMENTS_PER_USER:-100}
      MAX_STORAGE_BYTES_PER_USER: ${MAX_STORAGE_BYTES_PER_USER:-104857600}
      # Hosted mode has no passphrase gate. Only self-hosted instances set `claim`.
      AUTH_MODE: "off"
    volumes:
      - docxcraft-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4175"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Derive the free hostname from the VM's public IP, e.g. IP 140.238.10.20
      # becomes docx-140-238-10-20.sslip.io, which resolves back to the VM and
      # lets Caddy issue a real Let's Encrypt certificate with no domain.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, e.g. docx-<vm-ip-with-dashes>.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  docxcraft-data:
  postgres-data:
  caddy-data:
  caddy-config:
